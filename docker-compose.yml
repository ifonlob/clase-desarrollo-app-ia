services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tdai
      POSTGRES_PASSWORD: tdai_pass
      POSTGRES_DB: tdai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdai -d tdai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    gpus: all
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    volumes:
      - ollama_data:/data

volumes:
  postgres_data:
  ollama_data:
